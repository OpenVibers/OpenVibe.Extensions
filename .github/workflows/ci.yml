name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      # No dependencies: the tests and the packer use Node's standard library only.
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: openvibe-coupons-helper
          path: dist/*.zip
          retention-days: 14
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@83c998b65424fb97e6f6de55ad9cc5981767e89c
