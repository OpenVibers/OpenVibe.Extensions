<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenVibe Companion</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <h1>OpenVibe Companion</h1>
  <p id="site" class="muted"></p>
</header>
<section id="actions" class="actions" hidden aria-label="Send this page to OpenVibe">
  <p id="actions-lede" class="lede"></p>
  <div class="row">
    <button type="button" id="keep" class="btn">Keep on my Rent board</button>
    <button type="button" id="fair" class="btn" hidden>Check the rent</button>
    <button type="button" id="watch" class="btn">Watch this page</button>
    <button type="button" id="delivery" class="btn" hidden>Compare delivery apps</button>
    <button type="button" id="rating" class="btn" hidden>Save its rating to OpenVibe Reviews</button>
  </div>
  <p id="actions-note" class="note muted">Opens openvibe.rent, openvibe.watch, openvibe.food or openvibe.reviews in a new tab with this page’s address.</p>
</section>
<main id="content" aria-live="polite"><p class="muted">Looking up this shop…</p></main>
<footer>
  <a id="settings" href="options.html" target="_blank" rel="noopener">Settings</a>
  <span class="muted"> · Reads this tab only when you open it.</span>
</footer>
<script src="lib/config.js"></script>
<script src="lib/host.js"></script>
<script src="lib/handoff.js"></script>
<script src="lib/api.js"></script>
<script src="lib/format.js"></script>
<script src="lib/platform.js"></script>
<script src="lib/controller.js"></script>
<script src="popup.js"></script>
</body>
</html>
